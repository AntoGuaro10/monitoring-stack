apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: loki
  namespace: monitoring
spec:
  interval: 3m
  timeout: 5m
  chart:
    spec:
      chart: loki
      version: '17.0.0'
      sourceRef:
        kind: HelmRepository
        name: grafana-community
        namespace: flux-system
      interval: 3m
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  valuesFrom:
    - kind: ConfigMap
      name: grafana-loki-values
      valuesKey: loki-values.yaml